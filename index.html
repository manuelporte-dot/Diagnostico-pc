<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Diagnostic</title>

<style>
:root{
  --bg:#0f172a;
  --sidebar:#020617;
  --card:#1e293b;
  --accent:#22c55e;
  --danger:#ef4444;
  --warn:#eab308;
  --text:#e2e8f0;
}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
}

/* NAV */
nav{
  background:var(--sidebar);
  padding:15px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #1e293b;
}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:220px 1fr;
}

/* SIDEBAR */
.sidebar{
  background:var(--sidebar);
  padding:20px;
  height:100vh;
}

.sidebar h3{
  margin-bottom:20px;
}

.menu div{
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.menu div:hover{
  background:#1e293b;
}

/* CONTENT */
.content{
  padding:20px;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
}

/* KPI */
.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.kpi{
  text-align:center;
  padding:15px;
  border-radius:10px;
  background:#020617;
}

/* FORM */
input{
  width:100%;
  padding:10px;
  margin:5px 0 15px;
  border:none;
  border-radius:8px;
  background:#020617;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
}

button:hover{opacity:0.8}

/* STATES */
.optimo{background:var(--accent);color:black;}
.regular{background:var(--warn);color:black;}
.critico{background:var(--danger);}

/* PROGRESS */
.bar{
  height:8px;
  background:#334155;
  border-radius:10px;
  overflow:hidden;
}
.fill{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:1s;
}
</style>
</head>

<body>

<nav>
<div>🏢 Enterprise Diagnostic System</div>
<div>Admin</div>
</nav>

<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>Menú</h3>
<div class="menu">
<div onclick="view('dash')">Dashboard</div>
<div onclick="view('analisis')">Diagnóstico</div>
<div onclick="view('historial')">Historial</div>
</div>
</div>

<!-- CONTENT -->
<div class="content">

<!-- DASHBOARD -->
<div id="dash">
<div class="kpis">
<div class="kpi">Total<br><b id="t"></b></div>
<div class="kpi">Promedio<br><b id="p"></b></div>
<div class="kpi">Óptimos<br><b id="o"></b></div>
<div class="kpi">Críticos<br><b id="c"></b></div>
</div>
</div>

<!-- ANALISIS -->
<div id="analisis" style="display:none">
<div class="card">

<h3>Diagnóstico del sistema</h3>

<input id="ram" placeholder="RAM (GB)">
<input id="cpu" placeholder="CPU (%)">
<input id="temp" placeholder="Temperatura °C">
<input id="disk" placeholder="Disco libre %">

<button onclick="analizar()">Ejecutar análisis</button>

<div id="res"></div>

</div>
</div>

<!-- HISTORIAL -->
<div id="historial" style="display:none">
<div id="lista"></div>
</div>

</div>
</div>

<script>
let data=[];

function view(v){
["dash","analisis","historial"].forEach(x=>document.getElementById(x).style.display="none");
document.getElementById(v).style.display="block";
update();
}

function analizar(){
let r=+ram.value,c=+cpu.value,t=+temp.value,d=+disk.value;

let score=100,estado="Óptimo";
let problemas=[],rec=[];

if(r<8){score-=20;problemas.push("RAM baja");rec.push("Aumentar RAM");}
if(c>80){score-=25;problemas.push("CPU alta");rec.push("Cerrar procesos");}
if(t>80){score-=30;problemas.push("Temperatura alta");rec.push("Revisar ventilación");}
if(d<20){score-=15;problemas.push("Disco lleno");rec.push("Liberar espacio");}

if(score<80)estado="Regular";
if(score<50)estado="Crítico";

data.push({score,estado,fecha:new Date().toLocaleTimeString()});

res.innerHTML=`
<div class="card ${estado.toLowerCase()}">
<h3>${estado}</h3>
<p>Score: ${score}%</p>
<div class="bar"><div class="fill" id="barra"></div></div>

<h4>Problemas</h4>
<ul>${problemas.map(p=>"<li>"+p+"</li>").join("")}</ul>

<h4>Recomendaciones</h4>
<ul>${rec.map(r=>"<li>"+r+"</li>").join("")}</ul>
</div>
`;

setTimeout(()=>barra.style.width=score+"%",100);

update();
}

function update(){
t.innerText=data.length;
p.innerText=Math.round(data.reduce((a,b)=>a+b.score,0)/data.length)||0;
o.innerText=data.filter(d=>d.estado=="Óptimo").length;
c.innerText=data.filter(d=>d.estado=="Crítico").length;

lista.innerHTML=data.map(d=>`
<div class="card">
${d.estado} - ${d.score}%<br>${d.fecha}
</div>
`).reverse().join("");
}
</script>

</body>
</html>
