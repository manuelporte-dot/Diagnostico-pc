<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI System Enterprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#020617;
  color:white;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns:2fr 1fr;
  height:100vh;
}

/* PANEL */
.panel{
  padding:20px;
  background:#0f172a;
  overflow:auto;
}

/* INPUT / SELECT */
input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#020617;
  color:white;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#22c55e;
  border:none;
}

/* BLOQUES */
.box{
  background:#020617;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.hist{
  font-size:12px;
  border-bottom:1px solid #334155;
  padding:5px 0;
}
</style>
</head>

<body>

<div class="main">

<div></div>

<div class="panel">

<h3>📋 Encuesta</h3>

<select id="marca">
<option>HP</option>
<option>Dell</option>
<option>Lenovo</option>
<option>Asus</option>
</select>

<select id="edad">
<option value="1">0-1 años</option>
<option value="3">2-3 años</option>
<option value="5">4-5 años</option>
<option value="7">6+ años</option>
</select>

<select id="causa">
<option>lentitud</option>
<option>sobrecalentamiento</option>
<option>ruido</option>
<option>fallos</option>
</select>

<select id="procesos">
<option>navegador</option>
<option>juegos</option>
<option>edicion</option>
<option>ofimatica</option>
</select>

<h3>⚙️ Datos técnicos</h3>

<input id="ram" placeholder="RAM GB">
<input id="cpu" placeholder="CPU %">
<input id="temp" placeholder="Temp °C">
<input id="disk" placeholder="Disco %">

<button onclick="analizar()">Analizar</button>

<div id="resultado"></div>
<div id="ia"></div>

<h3>📊 Historial</h3>
<div id="historial"></div>

</div>

</div>

<script>

// VOZ
function hablar(t){
let m=new SpeechSynthesisUtterance(t);
m.lang="es-ES";
speechSynthesis.speak(m);
}

// CARGAR HISTORIAL
let historialData = JSON.parse(localStorage.getItem("historial")) || [];
renderHistorial();

function analizar(){

let marca=document.getElementById("marca").value;
let edad=+document.getElementById("edad").value;
let causa=document.getElementById("causa").value;
let procesos=document.getElementById("procesos").value;

let r=+ram.value,c=+cpu.value,t=+temp.value,d=+disk.value;

// SCORE
let score=100;
if(r<8)score-=20;
if(c>80)score-=25;
if(t>80)score-=30;
if(d<20)score-=15;

let estado="Óptimo";
if(score<80)estado="Regular";
if(score<50)estado="Crítico";

// IA
let rec=[];

if(r<8) rec.push("Aumentar RAM.");
if(c>80) rec.push("Reducir uso de CPU.");
if(t>80) rec.push("Mejorar ventilación.");
if(d<20) rec.push("Liberar disco.");

// ENCUESTA
if(edad>5) rec.push("Equipo antiguo, considerar actualización.");
if(causa=="lentitud") rec.push("Optimizar inicio.");
if(procesos=="juegos") rec.push("Revisar requisitos gráficos.");

if(rec.length==0) rec.push("Sistema estable.");

// UI
resultado.innerHTML=`<div class="box">${estado} (${score}%)</div>`;

ia.innerHTML=`
<div class="box">
<b>IA:</b><br>
${rec.join("<br>")}
</div>
`;

// GUARDAR
let registro={
fecha:new Date().toLocaleString(),
estado,
score,
marca,
edad,
causa
};

historialData.push(registro);
localStorage.setItem("historial", JSON.stringify(historialData));

renderHistorial();

// VOZ
hablar("Estado " + estado);

}

// MOSTRAR HISTORIAL
function renderHistorial(){
historial.innerHTML="";
historialData.slice().reverse().forEach(r=>{
historial.innerHTML+=`
<div class="hist">
${r.fecha} - ${r.estado} (${r.score}%)
</div>
`;
});
}

</script>

</body>
</html>
