<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Core System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#020617;
  color:white;
}

/* HEADER */
header{
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  background:#020617;
  border-bottom:1px solid #1e293b;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns:2fr 1fr;
  height:calc(100vh - 60px);
}

/* MAPA */
.map{
  position:relative;
}

/* NODOS */
.node{
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#1e293b;
  transition:0.4s;
}

/* POSICIONES */
#core{top:45%;left:45%;border:2px solid #22c55e;}
#ram{top:15%;left:20%;}
#cpu{top:75%;left:20%;}
#temp{top:15%;left:70%;}
#disk{top:75%;left:70%;}

/* LINEAS ANIMADAS */
.line{
  position:absolute;
  width:200px;
  height:2px;
  background:linear-gradient(90deg,transparent,#22c55e,transparent);
  animation:flow 2s linear infinite;
}
@keyframes flow{
  0%{background-position:0}
  100%{background-position:200px}
}

/* PANEL */
.panel{
  padding:20px;
  background:#0f172a;
  overflow:auto;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
  background:#020617;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  cursor:pointer;
}

/* KPI */
.kpi{
  margin-top:10px;
  padding:10px;
  background:#020617;
  border-radius:8px;
}

/* STATES */
.optimo{background:#22c55e;color:black;}
.regular{background:#eab308;color:black;}
.critico{
  background:#ef4444;
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 10px red;}
  50%{box-shadow:0 0 30px red;}
  100%{box-shadow:0 0 10px red;}
}

/* IA */
.ai{
  margin-top:15px;
  padding:15px;
  background:#020617;
  border-left:4px solid #22c55e;
}
</style>
</head>

<body>

<header>
<div>🧠 AI Core System</div>
<div id="status">● Operativo</div>
</header>

<div class="main">

<!-- MAPA -->
<div class="map">

<div id="core" class="node">CORE</div>
<div id="ram" class="node">RAM</div>
<div id="cpu" class="node">CPU</div>
<div id="temp" class="node">TEMP</div>
<div id="disk" class="node">DISK</div>

<!-- LINEAS -->
<div class="line" style="top:50%;left:50%;transform:rotate(45deg)"></div>
<div class="line" style="top:50%;left:50%;transform:rotate(-45deg)"></div>
<div class="line" style="top:50%;left:50%;transform:rotate(120deg)"></div>
<div class="line" style="top:50%;left:50%;transform:rotate(-120deg)"></div>

</div>

<!-- PANEL -->
<div class="panel">

<h3>Panel Técnico</h3>

<input id="ramInput" placeholder="RAM (GB)">
<input id="cpuInput" placeholder="CPU (%)">
<input id="tempInput" placeholder="Temp (°C)">
<input id="diskInput" placeholder="Disco (%)">

<button onclick="analizar()">Ejecutar análisis</button>

<div id="kpis"></div>
<div id="resultado"></div>
<div id="ia"></div>

</div>

</div>

<script>

// VOZ
function hablar(t){
let m=new SpeechSynthesisUtterance(t);
m.lang="es-ES";
speechSynthesis.speak(m);
}

// ANALISIS
function analizar(){

let r=+ramInput.value,c=+cpuInput.value,t=+tempInput.value,d=+diskInput.value;

let score=100;
if(r<8)score-=20;
if(c>80)score-=25;
if(t>80)score-=30;
if(d<20)score-=15;

let estado="Óptimo";
if(score<80)estado="Regular";
if(score<50)estado="Crítico";

// KPI
kpis.innerHTML=`
<div class="kpi">RAM: ${r} GB</div>
<div class="kpi">CPU: ${c}%</div>
<div class="kpi">Temp: ${t}°C</div>
<div class="kpi">Disco: ${d}%</div>
<div class="kpi">Score: ${score}%</div>
`;

// RESULTADO
resultado.innerHTML=`<div class="${estado.toLowerCase()} kpi">${estado}</div>`;

// IA
let exp="",rec="";
if(estado=="Óptimo"){
exp="El sistema opera dentro de parámetros normales.";
rec="No se requieren acciones correctivas.";
}
else if(estado=="Regular"){
exp="Se detectan desviaciones que afectan el rendimiento.";
rec="Optimizar recursos y monitorear.";
}
else{
exp="El sistema presenta condiciones críticas.";
rec="Intervención inmediata necesaria.";
}

ia.innerHTML=`
<div class="ai">
<b>IA:</b><br>
${exp}<br><br>
<b>Acción:</b> ${rec}
</div>
`;

hablar(estado + ". " + exp);

// NODOS
update("ram",r<8,r<4);
update("cpu",c>80,c>90);
update("temp",t>80,t>90);
update("disk",d<20,d<10);

}

// NODOS ESTADO
function update(id,warn,crit){
let el=document.getElementById(id);
el.className="node";

if(crit) el.classList.add("critico");
else if(warn) el.classList.add("regular");
else el.classList.add("optimo");
}

</script>

</body>
</html>
