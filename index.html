<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Diagnostic Enterprise v4.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --verde: #22c55e;
        --amarillo: #eab308;
        --rojo: #ef4444;
        --azul: #3b82f6;
        --oscuro: #020617;
        --panel: rgba(15, 23, 42, 0.85);
    }

    * { box-sizing: border-box; transition: all 0.4s ease; }

    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: white;
        background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95)),
                    url('https://images.unsplash.com/photo-1558494949-ef010cbdcc4b?q=80&w=2034&auto=format&fit=crop');
        background-size: cover;
        background-attachment: fixed;
        height: 100vh;
        overflow: hidden;
    }

    /* LOGIN */
    #login {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: var(--oscuro); z-index: 1000;
        display: flex; justify-content: center; align-items: center;
    }
    .login-card {
        background: var(--panel); padding: 40px; border-radius: 20px;
        text-align: center; border: 1px solid rgba(255,255,255,0.1); width: 350px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* APP LAYOUT */
    #app { display: none; padding: 20px; height: 100vh; }
    header {
        text-align: center; padding: 10px; font-weight: bold; font-size: 1.2rem;
        letter-spacing: 5px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .main-grid {
        display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px;
        margin-top: 20px; height: calc(100vh - 100px);
    }

    /* MAPA VISUAL */
    .mapa {
        background: rgba(255,255,255,0.02); border-radius: 25px;
        position: relative; border: 1px solid rgba(255,255,255,0.05);
    }

    .nodo {
        position: absolute; width: 115px; height: 115px; border-radius: 50%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #1e293b; border: 2px solid rgba(255,255,255,0.1);
        text-align: center; font-size: 0.75rem; font-weight: bold;
    }
    .nodo b { font-size: 1.2rem; display: block; margin-top: 5px; }

    /* ESTADOS */
    .optimo { background: var(--verde) !important; box-shadow: 0 0 25px var(--verde); border-color: white; }
    .regular { background: var(--amarillo) !important; box-shadow: 0 0 25px var(--amarillo); border-color: white; }
    .critico { background: var(--rojo) !important; animation: pulso 1.5s infinite; border-color: white; }

    @keyframes pulso {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
        70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .pensando { animation: blink 0.5s infinite; opacity: 0.6; }
    @keyframes blink { 50% { opacity: 0.2; } }

    #node-core { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 160px; height: 160px; z-index: 5; }
    #node-ram  { top: 15%; left: 20%; }
    #node-temp { top: 15%; right: 20%; }
    #node-cpu  { bottom: 15%; left: 20%; }
    #node-disk { bottom: 15%; right: 20%; }

    /* PANEL DERECHO */
    .side-panel {
        background: var(--panel); border-radius: 25px; padding: 25px;
        backdrop-filter: blur(15px); overflow-y: auto; border: 1px solid rgba(255,255,255,0.1);
    }

    h3 { font-size: 0.9rem; color: var(--azul); text-transform: uppercase; margin-bottom: 15px; border-left: 4px solid var(--azul); padding-left: 10px; }
    input, select {
        width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white;
    }

    button {
        width: 100%; padding: 15px; margin-top: 15px; border-radius: 12px;
        border: none; background: var(--verde); color: var(--oscuro); font-weight: bold;
        cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
    }
    button:disabled { background: #334155; cursor: not-allowed; color: #94a3b8; }

    .box-info { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; font-size: 0.85rem; line-height: 1.5; min-height: 60px; border: 1px solid rgba(255,255,255,0.05); }
    .hist-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
</style>
</head>
<body>

<div id="login">
    <div class="login-card">
        <h2>CORE AI</h2>
        <p style="color: #64748b; font-size: 0.8rem;">INTRODUZCA CREDENCIALES</p>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button onclick="checkLogin()">CONECTAR</button>
    </div>
</div>

<div id="app">
    <header>Network Health Monitor v4.0</header>

    <div class="main-grid">
        <div class="mapa">
            <div id="node-core" class="node">SISTEMA<b id="v-core">--</b></div>
            <div id="node-ram" class="node">RAM<b id="v-ram">-</b></div>
            <div id="node-temp" class="node">TEMP<b id="v-temp">-</b></div>
            <div id="node-cpu" class="node">CPU<b id="v-cpu">-</b></div>
            <div id="node-disk" class="node">DISCO<b id="v-disk">-</b></div>
        </div>

        <div class="side-panel">
            <h3>⚙️ Configuración de Activo</h3>
            <div style="display: flex; gap: 10px;">
                <select id="marca"><option>Dell PowerEdge</option><option>HP ProLiant</option></select>
                <select id="edad"><option value="1">0-2 años</option><option value="5">5+ años</option></select>
            </div>
            
            <h3>📊 Telemetría</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="number" min="0" id="in-ram" placeholder="RAM Lib (GB)">
                <input type="number" min="0" id="in-cpu" placeholder="CPU Uso (%)">
                <input type="number" min="0" id="in-temp" placeholder="Temp (°C)">
                <input type="number" min="0" id="in-disk" placeholder="Disco Lib (%)">
            </div>
            <button id="btn-scan" onclick="intervencionIA()">INICIAR ESCANEO IA</button>

            <h3>🤖 Respuesta de la IA</h3>
            <div id="ia-box" class="box-info">Sistema en espera. Ingrese telemetría para análisis.</div>

            <h3>📑 Historial</h3>
            <div id="historial" class="box-info"></div>
        </div>
    </div>
</div>

<script>
    const db = JSON.parse(localStorage.getItem("ai_logs")) || [];

    function checkLogin() {
        if(document.getElementById('pass').value === "1234") {
            document.getElementById('login').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                renderHist();
            }, 500);
        } else { alert("Acceso denegado"); }
    }

    function hablar(texto) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'es-ES';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
    }

    function intervencionIA() {
        const r = parseFloat(document.getElementById('in-ram').value);
        const c = parseFloat(document.getElementById('in-cpu').value);
        const t = parseFloat(document.getElementById('in-temp').value);
        const d = parseFloat(document.getElementById('in-disk').value);

        if([r,c,t,d].some(isNaN)) return alert("Faltan datos técnicos");

        // EFECTO DE PENSAR
        const btn = document.getElementById('btn-scan');
        const iaBox = document.getElementById('ia-box');
        const nodos = document.querySelectorAll('.nodo');
        
        btn.disabled = true;
        btn.innerText = "PROCESANDO RED NEURONAL...";
        iaBox.innerHTML = "<span style='color:var(--amarillo)'>🛰️ Analizando paquetes de datos...</span>";
        nodos.forEach(n => n.classList.add('pensando'));

        setTimeout(() => {
            // LÓGICA DE SALUD
            let score = 100;
            let fallos = [];

            if(r < 8) { score -= 20; fallos.push("memoria insuficiente"); }
            if(c > 85) { score -= 25; fallos.push("sobrecarga de procesador"); }
            if(t > 80) { score -= 30; fallos.push("exceso de temperatura"); }
            if(d < 15) { score -= 15; fallos.push("poco espacio en disco"); }

            score = Math.max(0, score);
            let estado = score < 50 ? "CRÍTICO" : (score < 80 ? "REGULAR" : "ÓPTIMO");

            // ACTUALIZAR MAPA
            nodos.forEach(n => n.classList.remove('pensando'));
            updateNodo('node-ram', r < 8, r < 4, r + "GB", 'v-ram');
            updateNodo('node-cpu', c > 75, c > 90, c + "%", 'v-cpu');
            updateNodo('node-temp', t > 75, t > 85, t + "°C", 'v-temp');
            updateNodo('node-disk', d < 25, d < 10, d + "%", 'v-disk');
            updateNodo('node-core', score < 80, score < 50, score + "%", 'v-core');

            // IA RESPONDE
            let txtIA = `<b>Informe:</b> Estado ${estado}. Salud al ${score}%. <br>`;
            txtIA += fallos.length > 0 ? "⚠️ Detectado: " + fallos.join(", ") : "✅ Todos los sistemas nominales.";
            iaBox.innerHTML = txtIA;

            // IA HABLA
            hablar(`Análisis completo. El sistema se encuentra en estado ${estado}. Salud general del ${score} por ciento. ` + 
                  (fallos.length > 0 ? "Atención requerida en " + fallos[0] : "No se requieren acciones."));

            // GUARDAR
            db.push({ h: new Date().toLocaleTimeString(), e: estado, s: score });
            localStorage.setItem("ai_logs", JSON.stringify(db));
            renderHist();

            btn.disabled = false;
            btn.innerText = "INICIAR ESCANEO IA";
        }, 2000);
    }

    function updateNodo(id, warn, crit, val, labelId) {
        const el = document.getElementById(id);
        document.getElementById(labelId).innerText = val;
        el.className = "nodo";
        if(crit) el.classList.add('critico');
        else if(warn) el.classList.add('regular');
        else el.classList.add('optimo');
    }

    function renderHist() {
        const h = document.getElementById('historial');
        h.innerHTML = db.slice(-4).reverse().map(l => `
            <div class="hist-item">
                <span>${l.h}</span>
                <span style="color:${l.s < 50 ? 'var(--rojo)' : (l.s < 80 ? 'var(--amarillo)' : 'var(--verde)')}">${l.s}%</span>
            </div>
        `).join("");
    }
</script>
</body>
</html>
