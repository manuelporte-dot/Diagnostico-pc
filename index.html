<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Diagnóstico Enterprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Segoe UI;
  color:white;

  background:
    linear-gradient(rgba(2,6,23,0.85), rgba(2,6,23,0.95)),
    url("https://images.unsplash.com/photo-1587202372775-e229f172b9d7");

  background-size:cover;
  background-position:center;
}

/* LOGIN */
#login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  background:rgba(15,23,42,0.8);
  padding:30px;
  border-radius:15px;
  width:300px;
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:10px;
  background:#020617;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  cursor:pointer;
}

/* APP */
#app{display:none;}

header{
  padding:15px;
  text-align:center;
  font-size:20px;
}

.main{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  padding:20px;
}

/* MAPA */
.map{
  position:relative;
  height:500px;
}

.node{
  position:absolute;
  width:90px;height:90px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#1e293b;
  transition:0.3s;
}

.optimo{background:#22c55e;}
.regular{background:#eab308;}
.critico{background:#ef4444; box-shadow:0 0 20px red;}

#ram{top:10%;left:20%;}
#cpu{top:80%;left:20%;}
#temp{top:10%;left:70%;}
#disk{top:80%;left:70%;}
#core{top:45%;left:45%;border:2px solid #22c55e;}

/* PANEL */
.panel{
  background:rgba(15,23,42,0.7);
  padding:15px;
  border-radius:15px;
  backdrop-filter:blur(10px);
}

.box{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

.hist{
  font-size:12px;
  border-bottom:1px solid #334155;
  padding:5px 0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h3>🔐 Iniciar sesión</h3>
    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app">

<header>🧠 Sistema Inteligente de Diagnóstico</header>

<div class="main">

<!-- MAPA -->
<div class="map">
  <div id="core" class="node">CORE</div>
  <div id="ram" class="node">RAM</div>
  <div id="cpu" class="node">CPU</div>
  <div id="temp" class="node">TEMP</div>
  <div id="disk" class="node">DISK</div>
</div>

<!-- PANEL -->
<div class="panel">

<h3>📋 Encuesta</h3>
<select id="marca">
<option>HP</option><option>Dell</option><option>Lenovo</option>
</select>

<select id="edad">
<option value="1">0-1 años</option>
<option value="3">2-3 años</option>
<option value="5">4-5 años</option>
<option value="7">6+ años</option>
</select>

<select id="causa">
<option>lentitud</option>
<option>sobrecalentamiento</option>
<option>fallos</option>
</select>

<select id="procesos">
<option>navegador</option>
<option>juegos</option>
<option>edicion</option>
</select>

<h3>⚙️ Datos</h3>
<input id="ramInput" placeholder="RAM">
<input id="cpuInput" placeholder="CPU">
<input id="tempInput" placeholder="Temp">
<input id="diskInput" placeholder="Disco">

<button onclick="analizar()">Analizar</button>

<div id="resultado"></div>
<div id="ia"></div>

<h3>📊 Historial</h3>
<div id="historial"></div>

</div>

</div>
</div>

<script>

// LOGIN
function login(){
if(pass.value==="1234"){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
}else{
alert("Contraseña incorrecta");
}
}

// VOZ
function hablar(t){
let m=new SpeechSynthesisUtterance(t);
m.lang="es-ES";
speechSynthesis.speak(m);
}

// HISTORIAL
let data = JSON.parse(localStorage.getItem("data")) || [];
render();

// ANALIZAR
function analizar(){

let r=+ramInput.value,c=+cpuInput.value,t=+tempInput.value,d=+diskInput.value;
let edad=+document.getElementById("edad").value;
let causa=document.getElementById("causa").value;
let procesos=document.getElementById("procesos").value;

// SCORE
let score=100;
if(r<8)score-=20;
if(c>80)score-=25;
if(t>80)score-=30;
if(d<20)score-=15;

let estado="Óptimo";
if(score<80)estado="Regular";
if(score<50)estado="Crítico";

// UI
resultado.innerHTML=`<div class="box">${estado} (${score}%)</div>`;

// IA
let rec=[];
if(r<8) rec.push("Aumentar RAM");
if(c>80) rec.push("Cerrar procesos CPU");
if(t>80) rec.push("Limpiar ventilación");
if(d<20) rec.push("Liberar disco");

if(edad>5) rec.push("Actualizar hardware");
if(causa=="lentitud") rec.push("Optimizar sistema");
if(procesos=="juegos") rec.push("Revisar GPU");

ia.innerHTML=`<div class="box">${rec.join("<br>")}</div>`;

// VOZ
hablar("Estado " + estado);

// MAPA
update("ram",r<8,r<4);
update("cpu",c>80,c>90);
update("temp",t>80,t>90);
update("disk",d<20,d<10);

// GUARDAR
data.push({hora:new Date().toLocaleTimeString(),estado,score});
localStorage.setItem("data", JSON.stringify(data));
render();
}

// NODOS
function update(id,warn,crit){
let el=document.getElementById(id);
el.className="node";
if(crit) el.classList.add("critico");
else if(warn) el.classList.add("regular");
else el.classList.add("optimo");
}

// HISTORIAL
function render(){
historial.innerHTML="";
data.slice().reverse().forEach(d=>{
historial.innerHTML+=`<div class="hist">${d.hora} - ${d.estado} (${d.score}%)</div>`;
});
}

</script>

</body>
</html>
