<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Diagnóstico Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI;
  color:white;

  background:
    linear-gradient(rgba(2,6,23,0.85), rgba(2,6,23,0.95)),
    url("https://images.unsplash.com/photo-1587202372775-e229f172b9d7");

  background-size:cover;
  background-position:center;
}

/* HEADER */
header{
  padding:20px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:20px;
  padding:20px;
}

/* PANEL IZQUIERDO (VISUAL) */
.visual{
  display:flex;
  justify-content:center;
  align-items:center;
}

.card-big{
  width:80%;
  padding:30px;
  border-radius:20px;
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(10px);
  text-align:center;
}

.score{
  font-size:50px;
  margin:20px 0;
}

/* PANEL DERECHO */
.panel{
  padding:20px;
  border-radius:20px;
  background:rgba(15,23,42,0.7);
  backdrop-filter:blur(10px);
}

/* INPUTS */
input,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#020617;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button:hover{
  transform:scale(1.03);
}

/* RESULTADOS */
.box{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

/* HISTORIAL */
.hist{
  font-size:12px;
  border-bottom:1px solid #334155;
  padding:5px 0;
}

/* ANIMACIÓN */
.fade{
  animation:fade 0.5s ease;
}
@keyframes fade{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;}
}
</style>
</head>

<body>

<header>🧠 Sistema Inteligente de Diagnóstico</header>

<div class="main">

<!-- IZQUIERDA -->
<div class="visual">
  <div class="card-big">
    <h2>Estado del Sistema</h2>
    <div id="estado" class="score">--</div>
    <div id="detalle"></div>
  </div>
</div>

<!-- DERECHA -->
<div class="panel">

<h3>📋 Encuesta</h3>

<select id="marca">
<option>HP</option>
<option>Dell</option>
<option>Lenovo</option>
<option>Asus</option>
</select>

<select id="edad">
<option value="1">0-1 años</option>
<option value="3">2-3 años</option>
<option value="5">4-5 años</option>
<option value="7">6+ años</option>
</select>

<select id="causa">
<option>lentitud</option>
<option>sobrecalentamiento</option>
<option>ruido</option>
<option>fallos</option>
</select>

<select id="procesos">
<option>navegador</option>
<option>juegos</option>
<option>edicion</option>
<option>ofimatica</option>
</select>

<h3>⚙️ Datos técnicos</h3>

<input id="ram" placeholder="RAM GB">
<input id="cpu" placeholder="CPU %">
<input id="temp" placeholder="Temp °C">
<input id="disk" placeholder="Disco %">

<button onclick="analizar()">Analizar sistema</button>

<div id="ia"></div>

<h3>📊 Historial</h3>
<div id="historial"></div>

</div>

</div>

<script>

// VOZ
function hablar(t){
let m=new SpeechSynthesisUtterance(t);
m.lang="es-ES";
speechSynthesis.speak(m);
}

// HISTORIAL
let data = JSON.parse(localStorage.getItem("data")) || [];
render();

// ANALISIS
function analizar(){

let marca=marca.value;
let edad=+document.getElementById("edad").value;
let causa=document.getElementById("causa").value;
let procesos=document.getElementById("procesos").value;

let r=+ram.value,c=+cpu.value,t=+temp.value,d=+disk.value;

// SCORE
let score=100;
if(r<8)score-=20;
if(c>80)score-=25;
if(t>80)score-=30;
if(d<20)score-=15;

let estado="Óptimo";
if(score<80)estado="Regular";
if(score<50)estado="Crítico";

// UI IZQUIERDA
document.getElementById("estado").innerText=score+"%";
document.getElementById("detalle").innerText=estado;

// IA
let rec=[];

if(r<8) rec.push("Aumentar RAM");
if(c>80) rec.push("Cerrar procesos CPU");
if(t>80) rec.push("Limpiar ventilación");
if(d<20) rec.push("Liberar disco");

if(edad>5) rec.push("Actualizar hardware");
if(causa=="lentitud") rec.push("Optimizar inicio");
if(procesos=="juegos") rec.push("Revisar GPU");

if(rec.length==0) rec.push("Sistema estable");

ia.innerHTML=`
<div class="box fade">
<b>IA recomienda:</b><br>${rec.join("<br>")}
</div>
`;

// GUARDAR
data.push({
fecha:new Date().toLocaleTimeString(),
score,
estado
});
localStorage.setItem("data", JSON.stringify(data));
render();

// VOZ
hablar("Estado " + estado);

}

// RENDER HISTORIAL
function render(){
historial.innerHTML="";
data.slice().reverse().forEach(d=>{
historial.innerHTML+=`
<div class="hist">${d.fecha} - ${d.estado} (${d.score}%)</div>
`;
});
}

</script>

</body>
</html>
