<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Diagnostic Voice</title>

<style>
:root{
  --bg:linear-gradient(135deg,#020617,#0f172a);
  --glass:rgba(255,255,255,0.05);
  --accent:#22c55e;
  --danger:#ef4444;
  --warn:#eab308;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI';
  background:var(--bg);
  color:white;
}

/* GLASS */
.card{
  backdrop-filter:blur(20px);
  background:var(--glass);
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  animation:fade 0.6s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1}
}

/* LOGIN */
#login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:220px 1fr;
  height:100vh;
}

/* SIDEBAR */
.sidebar{padding:20px;}
.menu div{
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  cursor:pointer;
}
.menu div:hover{background:rgba(255,255,255,0.1);}

/* CONTENT */
.content{
  padding:30px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  background:rgba(0,0,0,0.3);
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
}
button:hover{transform:scale(1.03);}

/* RESULT */
.result{
  margin-top:15px;
  padding:15px;
  border-radius:12px;
}
.optimo{background:var(--accent);color:black;}
.regular{background:var(--warn);color:black;}
.critico{background:var(--danger);}

/* IA */
.ai{
  margin-top:15px;
  padding:15px;
  border-left:4px solid var(--accent);
  background:rgba(0,0,0,0.3);
  border-radius:10px;
  font-style:italic;
}

/* KPI */
.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.kpi{
  text-align:center;
  padding:15px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
}

/* LOADER */
.loader{
  border:3px solid rgba(255,255,255,0.1);
  border-top:3px solid var(--accent);
  border-radius:50%;
  width:30px;
  height:30px;
  animation:spin 1s linear infinite;
  margin:auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="card" style="width:300px">
<h2>AI Login</h2>
<input id="user" placeholder="Usuario">
<button onclick="login()">Entrar</button>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
<div class="layout">

<div class="sidebar card">
<h3>🧠 AI System</h3>
<div class="menu">
<div onclick="view('dash')">Dashboard</div>
<div onclick="view('analisis')">Diagnóstico</div>
</div>
</div>

<div class="content">

<!-- DASH -->
<div id="dash">
<div class="kpis">
<div class="kpi">Total<br><b id="t"></b></div>
<div class="kpi">Promedio<br><b id="p"></b></div>
<div class="kpi">Óptimos<br><b id="o"></b></div>
<div class="kpi">Críticos<br><b id="c"></b></div>
</div>
</div>

<!-- ANALISIS -->
<div id="analisis" style="display:none">
<div class="card">

<h3>Diagnóstico Inteligente</h3>

<input id="ram" placeholder="RAM">
<input id="cpu" placeholder="CPU">
<input id="temp" placeholder="Temperatura">
<input id="disk" placeholder="Disco">

<button onclick="analizar()">Analizar</button>

<div id="res"></div>
<div id="ai"></div>

</div>
</div>

</div>
</div>
</div>

<script>
let data=[];

// LOGIN
function login(){
  let u=document.getElementById("user").value;
  if(u){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    update();
  }
}

// NAV
function view(v){
  ["dash","analisis"].forEach(x=>document.getElementById(x).style.display="none");
  document.getElementById(v).style.display="block";
}

// VOZ IA
function hablar(texto){
  let msg=new SpeechSynthesisUtterance(texto);
  msg.lang="es-ES";
  msg.rate=1;
  speechSynthesis.speak(msg);
}

// ANALISIS
function analizar(){

  res.innerHTML='<div class="loader"></div>';
  ai.innerHTML="";

  setTimeout(()=>{

    let r=+ram.value,c=+cpu.value,t=+temp.value,d=+disk.value;
    let score=100,estado="Óptimo",mensaje="";

    if(r<8)score-=20;
    if(c>80)score-=25;
    if(t>80)score-=30;
    if(d<20)score-=15;

    if(score<80)estado="Regular";
    if(score<50)estado="Crítico";

    data.push({score,estado});

    if(estado=="Óptimo"){
      mensaje="El sistema funciona correctamente.";
    }else if(estado=="Regular"){
      mensaje="Se recomienda optimizar el sistema.";
    }else{
      mensaje="Estado crítico. Se requiere intervención inmediata.";
    }

    res.innerHTML=`<div class="result ${estado.toLowerCase()}">${estado} - ${score}%</div>`;
    ai.innerHTML=`<div class="ai">🧠 IA: ${mensaje}</div>`;

    hablar(mensaje); // 🔊 IA HABLA

    update();

  },1000);
}

// KPIs
function update(){
  t.innerText=data.length;
  p.innerText=Math.round(data.reduce((a,b)=>a+b.score,0)/data.length)||0;
  o.innerText=data.filter(d=>d.estado=="Óptimo").length;
  c.innerText=data.filter(d=>d.estado=="Crítico").length;
}
</script>

</body>
</html>
