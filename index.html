<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Diagnostic SaaS</title>

<style>
:root{
  --bg:#0f172a;
  --sidebar:#020617;
  --card:#1e293b;
  --accent:#22c55e;
  --danger:#ef4444;
  --warn:#eab308;
  --text:#e2e8f0;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:var(--text);
}

/* LOGIN */
#login{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.login-box{
  background:var(--card);
  padding:30px;
  border-radius:15px;
  width:300px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  background:#020617;
  color:white;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
}

.layout{
  display:grid;
  grid-template-columns:220px 1fr;
}

/* SIDEBAR */
.sidebar{
  background:var(--sidebar);
  height:100vh;
  padding:20px;
}

.menu div{
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  cursor:pointer;
}
.menu div:hover{background:#1e293b}

/* CONTENT */
.content{padding:20px}

.card{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
}

/* KPIs */
.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.kpi{
  background:#020617;
  padding:15px;
  text-align:center;
  border-radius:10px;
}

/* STATES */
.optimo{background:var(--accent);color:black;}
.regular{background:var(--warn);color:black;}
.critico{background:var(--danger);}

/* BAR */
.bar{
  height:8px;
  background:#334155;
  border-radius:10px;
}
.fill{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:1s;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<h2>Login</h2>
<input id="user" placeholder="Usuario">
<button onclick="login()">Entrar</button>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="layout">

<div class="sidebar">
<h3>Dashboard</h3>
<div class="menu">
<div onclick="view('dash')">Inicio</div>
<div onclick="view('analisis')">Diagnóstico</div>
<div onclick="view('historial')">Historial</div>
</div>
</div>

<div class="content">

<!-- DASH -->
<div id="dash">
<div class="kpis">
<div class="kpi">Total<br><b id="t"></b></div>
<div class="kpi">Promedio<br><b id="p"></b></div>
<div class="kpi">Óptimos<br><b id="o"></b></div>
<div class="kpi">Críticos<br><b id="c"></b></div>
</div>
<div class="card"><canvas id="chart"></canvas></div>
</div>

<!-- ANALISIS -->
<div id="analisis" style="display:none">
<div class="card">
<h3>Análisis</h3>

<input id="ram" placeholder="RAM GB">
<input id="cpu" placeholder="CPU %">
<input id="temp" placeholder="Temp °C">
<input id="disk" placeholder="Disco %">

<button onclick="analizar()">Analizar</button>

<div id="res"></div>
</div>
</div>

<!-- HISTORIAL -->
<div id="historial" style="display:none">
<div id="lista"></div>
</div>

</div>
</div>
</div>

<script>
let data=[];
let chart;

function login(){
  if(user.value){
    login.style.display="none";
    app.style.display="block";
    update();
  }
}

function view(v){
["dash","analisis","historial"].forEach(x=>document.getElementById(x).style.display="none");
document.getElementById(v).style.display="block";
update();
}

function analizar(){
let r=+ram.value,c=+cpu.value,t=+temp.value,d=+disk.value;

let score=100,estado="Óptimo";
let prob=[],rec=[];

if(r<8){score-=20;prob.push("RAM baja");rec.push("Aumentar RAM");}
if(c>80){score-=25;prob.push("CPU alta");rec.push("Cerrar procesos");}
if(t>80){score-=30;prob.push("Temperatura alta");rec.push("Revisar ventilación");}
if(d<20){score-=15;prob.push("Disco lleno");rec.push("Liberar espacio");}

if(score<80)estado="Regular";
if(score<50)estado="Crítico";

data.push({score,estado,fecha:new Date().toLocaleTimeString()});

res.innerHTML=`
<div class="card ${estado.toLowerCase()}">
<h3>${estado}</h3>
<p>Score: ${score}%</p>
<div class="bar"><div class="fill" id="barra"></div></div>

<h4>Problemas</h4>
<ul>${prob.map(p=>"<li>"+p+"</li>").join("")}</ul>

<h4>Recomendaciones</h4>
<ul>${rec.map(r=>"<li>"+r+"</li>").join("")}</ul>
</div>
`;

setTimeout(()=>barra.style.width=score+"%",100);

update();
}

function update(){
t.innerText=data.length;
p.innerText=Math.round(data.reduce((a,b)=>a+b.score,0)/data.length)||0;
o.innerText=data.filter(d=>d.estado=="Óptimo").length;
c.innerText=data.filter(d=>d.estado=="Crítico").length;

lista.innerHTML=data.map(d=>`
<div class="card">
${d.estado} - ${d.score}%<br>${d.fecha}
</div>
`).reverse().join("");

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:data.map(d=>d.fecha),
datasets:[{label:"Rendimiento",data:data.map(d=>d.score)}]
}
});
}
</script>

</body>
</html>
